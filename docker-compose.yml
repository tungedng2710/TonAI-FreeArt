services:
  app:
    build: .
    ports:
      - "7863:7863"
    environment:
      VLLM_OMNI_URL: ${VLLM_OMNI_URL:-http://8091--main--frontier--idp-lab.coder.vts-ai.space}
      VLLM_OMNI_EDIT_URL: ${VLLM_OMNI_EDIT_URL:-https://8092--main--frontier--idp-lab.coder.vts-ai.space}
      VLLM_OMNI_API_KEY: ${VLLM_OMNI_API_KEY:-}
      VLLM_OMNI_EDIT_API_KEY: ${VLLM_OMNI_EDIT_API_KEY:-}
      VLLM_OMNI_TIMEOUT_SECONDS: ${VLLM_OMNI_TIMEOUT_SECONDS:-1800}
      GPU_ID: ${GPU_ID:-0}
      CUDA_VISIBLE_DEVICES: ${GPU_ID:-0}
