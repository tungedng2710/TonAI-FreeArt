<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TonAI Imagine image generation and editing workspace." />
  <title>TonAI Imagine</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-icon" src="/static/logo.png" alt="TonAI Imagine logo" />
        <div>
          <span class="brand-name">TonAI Imagine</span>
          <span id="mode-chip" class="mode-chip">Text to Image</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <main class="workspace">
    <section class="panel controls-panel" aria-label="Image controls">
      <div class="mode-tabs" role="tablist" aria-label="Mode">
        <button class="mode-tab active" id="mode-text" type="button" role="tab" aria-selected="true" data-mode="text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2"/><path d="M9 20h6"/><path d="M12 5v15"/></svg>
          Text to Image
        </button>
        <button class="mode-tab" id="mode-image" type="button" role="tab" aria-selected="false" data-mode="image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          Image to Image
        </button>
      </div>

      <div id="source-field" class="field-group source-field hidden">
        <div class="label-row">
          <label for="source-image">Source images <span class="label-hint">max 2</span></label>
          <button id="remove-source" class="text-btn" type="button" disabled>Remove</button>
        </div>
        <label id="upload-zone" class="upload-zone" for="source-image">
          <input id="source-image" type="file" accept="image/*" multiple />
          <span id="upload-empty" class="upload-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8"/><path d="M12 3v12"/></svg>
            Choose up to 2 images
          </span>
          <div id="source-preview" class="source-preview" hidden></div>
        </label>
      </div>

      <div class="field-group">
        <div class="label-row">
          <label for="prompt">Prompt</label>
          <span id="prompt-counter" class="char-counter">0 / 700</span>
        </div>
        <textarea id="prompt" maxlength="700" placeholder="A cinematic portrait of a jazz pianist in a small club, warm stage light, 35mm film grain"></textarea>
      </div>

      <div id="text-settings">
        <div class="field-group">
          <label for="aspect_ratio_preset">Aspect ratio</label>
          <div class="ratio-grid">
            <button class="ratio-btn active" data-ratio="1:1" type="button">1:1</button>
            <button class="ratio-btn" data-ratio="4:3" type="button">4:3</button>
            <button class="ratio-btn" data-ratio="3:4" type="button">3:4</button>
            <button class="ratio-btn" data-ratio="16:9" type="button">16:9</button>
            <button class="ratio-btn" data-ratio="9:16" type="button">9:16</button>
            <button class="ratio-btn" data-ratio="3:2" type="button">3:2</button>
            <button class="ratio-btn" data-ratio="2:3" type="button">2:3</button>
          </div>
          <select id="aspect_ratio_preset" class="sr-only" aria-hidden="true">
            <option value="1:1" selected>1:1</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
          </select>
        </div>

        <div class="row row-3">
          <div class="field-group">
            <label for="width">Width <span class="label-hint">px</span></label>
            <input id="width" type="number" min="256" max="1536" step="16" value="1024" />
          </div>
          <div class="field-group">
            <label for="height">Height <span class="label-hint">px</span></label>
            <input id="height" type="number" min="256" max="1536" step="16" value="1024" />
          </div>
          <div class="field-group">
            <div class="label-row">
              <label for="image-count">Images</label>
              <output id="image-count-value" class="range-value" for="image-count">1</output>
            </div>
            <input id="image-count" class="image-count-range" type="range" min="1" max="2" step="1" value="1" aria-valuetext="1 image" />
            <div class="range-scale" aria-hidden="true">
              <span>1</span><span>2</span>
            </div>
          </div>
        </div>

        <input id="model" type="hidden" value="Qwen/Qwen-Image-2512" />
      </div>

      <div id="edit-settings" class="hidden">
        <input id="edit-model" type="hidden" value="Qwen-Image-Edit" />
      </div>

      <div class="row row-3">
        <div class="field-group">
          <label for="seed">Seed <span class="label-hint">-1 random</span></label>
          <input id="seed" type="number" step="1" value="-1" />
        </div>
        <div class="field-group">
          <label for="steps">Steps</label>
          <input id="steps" type="number" min="1" max="100" step="1" value="20" />
        </div>
        <div id="true-cfg-field" class="field-group hidden">
          <label for="true-cfg">CFG <span class="label-hint">0-20</span></label>
          <input id="true-cfg" type="number" min="0" max="20" step="0.1" value="4.0" />
        </div>
        <div id="guidance-field" class="field-group">
          <label for="guidance">Guidance <span class="label-hint">0-20</span></label>
          <input id="guidance" type="number" min="0" max="20" step="0.1" value="0.0" />
        </div>
      </div>

      <button id="generate" class="primary-btn" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h8l-1 8 11-14h-8l0-6Z"/></svg>
        <span id="generate-label">Generate</span>
      </button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="panel output-panel" aria-label="Image result">
      <div class="output-head">
        <div>
          <h1 id="output-title">Text to Image</h1>
          <p id="output-subtitle">Result</p>
        </div>
        <div class="output-actions">
          <button id="clear-btn" class="secondary-btn" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
            Clear
          </button>
          <button id="download-btn" class="secondary-btn" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
            Download
          </button>
        </div>
      </div>

      <div class="preview-grid" id="preview-grid">
        <div class="placeholder">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="placeholder-icon" aria-hidden="true"><rect x="5" y="8" width="38" height="32" rx="4" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="20" r="4" stroke="currentColor" stroke-width="2"/><path d="M6 35l10-10 8 8 6-6 12 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>No image yet</span>
        </div>
      </div>
    </section>

    <aside id="examples-panel" class="panel examples-panel" aria-labelledby="examples-title">
      <div class="examples-head">
        <div>
          <h2 id="examples-title">Prompt gallery</h2>
          <p>Choose an image to try its prompt</p>
        </div>
        <span class="examples-count">10</span>
      </div>
      <div class="example-prompts" aria-label="Prompt examples"></div>
    </aside>
  </main>

  <footer class="footer">
    <span>TonAI Imagine &copy; 2026</span>
    <span>Powered by vLLM-Omni</span>
    <span>Made by <a href="https://tungedng2710.github.io/" target="_blank" rel="noopener noreferrer">tungedng2710</a></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
